[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-rec"
version = "0.1.0"
description = "AI-powered restaurant recommendation system (Zomato-inspired MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=2.19.0",
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.32.0",
  "openai>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "httpx>=0.27.0"]
gemini = ["google-generativeai>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
