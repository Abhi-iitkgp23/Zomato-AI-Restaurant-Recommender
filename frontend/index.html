<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crave — AI Restaurant Finder</title>
    <meta name="description" content="Stop scrolling. Start eating. AI-picked restaurant recommendations across Bangalore." />
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="grain font-body text-body-md text-on-surface min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-white">
    <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
      <div class="absolute -top-32 left-1/4 h-96 w-96 rounded-full bg-primary-container/20 blur-3xl"></div>
      <div class="absolute top-1/3 -right-24 h-96 w-96 rounded-full bg-secondary-container/25 blur-3xl"></div>
      <div class="absolute bottom-20 left-10 h-80 w-80 rounded-full bg-tertiary-container/15 blur-3xl"></div>
    </div>

    <div id="app" class="relative z-10"></div>

    <noscript>
      <p class="p-8 text-center">Crave needs JavaScript enabled to find your next spot.</p>
    </noscript>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
